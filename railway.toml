[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @workspace/abyssal run build"
watchPatterns = [
  "artifacts/abyssal/**",
  "lib/api-client-react/**",
  "lib/api-spec/**",
  "lib/api-zod/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
  "railway.toml",
]

[deploy]
preDeployCommand = ["pnpm --filter @workspace/abyssal run db:migrate"]
startCommand = "pnpm --filter @workspace/abyssal run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
