kind = "web"
previewPath = "/"
title = "Abyssal: The Last Ascent"
description = "A cooperative underwater descent game. Swim the ruined ocean grid, share a submarine, and explore whether the surface is still there."
version = "1.0.0"
id = "artifacts/abyssal"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25393

[services.development]
run = "pnpm --filter @workspace/abyssal run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/abyssal", "run", "build" ]

[services.production.run]
args = [ "node", "--enable-source-maps", "artifacts/abyssal/.output/server/index.mjs" ]

[services.production.run.env]
PORT = "25393"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"

[services.env]
PORT = "25393"
BASE_PATH = "/"
