kind = "web"
previewPath = "/"
title = "Abyssal: The Last Ascent"
description = "A cooperative underwater descent game. Swim the ruined ocean grid, share a submarine, and explore whether the surface is still there."
version = "1.0.0"
id = "artifacts/abyssal"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/health", "/api/ocean", "/api/rtc", "/api/auth" ]
localPort = 25393

[services.development]
run = "pnpm --filter @workspace/abyssal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/abyssal", "run", "build" ]
serve = "pnpm --filter @workspace/abyssal run start"

[services.env]
PORT = "25393"
BASE_PATH = "/"
