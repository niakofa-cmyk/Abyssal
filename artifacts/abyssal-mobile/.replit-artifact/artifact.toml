kind = "mobile"
previewPath = "/mobile/"
title = "Abyssal: The Last Ascent — Mobile"
description = "A native mobile companion for Abyssal: The Last Ascent. Join and resume dives in the existing shared ocean, view live sectors and crew, and use touch controls to move, aim, repair, and interact."
version = "1.0.0"
id = "artifacts/abyssal-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 21803

[services.development]
run = "pnpm --filter @workspace/abyssal-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/abyssal-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/abyssal-mobile", "run", "serve" ]

[services.env]
PORT = "21803"
BASE_PATH = "/mobile/"
